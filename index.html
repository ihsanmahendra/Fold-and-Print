<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fold & Print</title>
<meta name="description" content="Fold & Print: a paper-folding color-mixing puzzle. © 2026 Ihsan Mahendra. All rights reserved.">
<meta name="author" content="Ihsan Mahendra">
<meta name="copyright" content="© 2026 Ihsan Mahendra. All rights reserved. Hak cipta dilindungi undang-undang.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fffdf8'/%3E%3Ccircle cx='11' cy='16' r='7' fill='%232f7de1'/%3E%3Ccircle cx='21' cy='16' r='7' fill='%23f5c518' fill-opacity='.85'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f3ede2; --ink:#2a2622; --quiet:#8b8277; --accent:#2a2622; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #wrap { position:relative; height:100%; max-width:480px; margin:0 auto; }
  canvas { display:block; width:100%; height:100%; touch-action:manipulation; }
  .overlay { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(243,237,226,.9); text-align:center; padding:24px; }
  .overlay.show { display:flex; }
  .overlay h1 { margin:0; font-size:34px; }
  .overlay p { margin:0; color:var(--quiet); max-width:300px; line-height:1.4; }
  button { font:inherit; font-weight:700; font-size:17px; border:0; border-radius:14px; padding:14px 26px;
    background:var(--ink); color:#fff; cursor:pointer; min-width:200px; }
  button.ghost { background:transparent; color:var(--ink); border:2px solid #cfc5b6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="overlay" id="win"><h1>Printed!</h1><p id="winText"></p><button id="next">Next sheet</button></div>
  <div class="overlay" id="lose"><h1 id="loseTitle">Smudged!</h1><p id="loseText"></p>
    <button id="undoAd">Undo last fold</button><button class="ghost" id="retry">Start over</button></div>
  <div class="overlay" id="done"><h1>Prototype complete</h1><p>That's every sheet in this build. Thanks for playing Fold & Print.</p><button id="again">Play again</button></div>
</div>
<script>
// ---------- Color model: R=1, Y=2, B=4. Mixes are the union of bits. ----------
const R = 1, Y = 2, B = 4;
const CODE = { '.': 0, r: R, y: Y, b: B, g: B | Y, o: R | Y, p: R | B, n: R | Y | B };
const PAINT = { [R]: '#e5484d', [Y]: '#f5c518', [B]: '#2f7de1', [B | Y]: '#36b37e', [R | Y]: '#f08a24', [R | B]: '#8e4ec6', [R | Y | B]: '#7a5230' };

// ---------- Levels ----------
// sheet: r/y/b/g/o/p paint, '.' blank; UPPERCASE = dry paint (stays put, never prints).
// tape: 't' cells are covered: they can't receive paint. Tape peels off after the next fold.
// sol: the intended folds, used to build the target picture. 'v3' = vertical crease left of column 3, 'h2' = horizontal crease above row 2.
const LEVELS = [
  { name: 'Butterfly', tip: 'Tap a crease tab, then FOLD. Wet paint prints onto the other side.',
    sheet: ['pp....', 'ppb...', '..b...', 'ppb...', 'pp....'], sol: ['v3'] },
  { name: 'Leaf', tip: 'Blue + Yellow = Green. Fold so they land on each other.',
    sheet: ['..by..', '.bbyy.', 'bbbyyy', '.bbyy.', '..yy..'], sol: ['v3'] },
  { name: 'Flower', tip: 'Two folds. Order is up to you this time.',
    sheet: ['r.y...', '.ry...', 'yyb...', '......', '......', '......'], sol: ['v3', 'h3'] },
  { name: 'Lighthouse', tip: 'The crease does not have to be in the middle. Keep the red off the rest.',
    sheet: ['bb.....', 'bbyy.rr', '..yy.rr', 'bbyy...', 'bb.....'], sol: ['v2'] },
  { name: 'Kite', tip: 'Taped squares stay clean. Tape peels off after one fold, so order matters.',
    sheet: ['b....y', 'bb..yy', 'r....r', '......'], tape: ['......', '......', '......', 'tttttt'], sol: ['v3', 'h2'] },
  { name: 'Owl', tip: 'Dry paint (matte, with a dotted ring) never prints. It only receives.',
    sheet: ['Y....b', '.Y..b.', 'rrRRrr', '......', '......', '......'], sol: ['h3', 'v3'] },
];

// ---------- Fold rules ----------
function parseCrease(c) { return { axis: c[0], k: +c.slice(1) }; }
function mirror(crease, x, y) {
  return crease.axis === 'v' ? { x: 2 * crease.k - 1 - x, y } : { x, y: 2 * crease.k - 1 - y };
}
// Both sides of the fold touch: each cell takes the wet paint of its mirror, unless it is taped.
function applyFold(board, crease) {
  const { w, h } = board, next = board.cells.map(c => ({ ...c }));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const m = mirror(crease, x, y);
    if (m.x < 0 || m.y < 0 || m.x >= w || m.y >= h) continue;
    const src = board.cells[m.y * w + m.x], dst = next[y * w + x];
    if (dst.tape || src.dry || !src.paint) continue;
    dst.paint |= src.paint;
  }
  next.forEach(c => { c.tape = false; });
  return { w, h, cells: next };
}
function makeBoard(L) {
  const h = L.sheet.length, w = L.sheet[0].length, cells = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = L.sheet[y][x], k = ch.toLowerCase();
    cells.push({ paint: CODE[k], dry: ch !== k, tape: !!(L.tape && L.tape[y][x] === 't') });
  }
  return { w, h, cells };
}
const smudges = (board, target) => board.cells.map((c, i) => (c.paint & ~target[i]) !== 0);
const matches = (board, target) => board.cells.every((c, i) => c.paint === target[i]);

// ---------- State ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, lvl, L, board, target, history, sel, anim, state, cs, sx, sy, firstTap;

function load(i) {
  lvl = i; L = LEVELS[i];
  board = makeBoard(L);
  target = L.sol.reduce((b, c) => applyFold(b, parseCrease(c)), board).cells.map(c => c.paint);
  history = []; sel = null; anim = null; state = 'play';
  hide(); layout();
}
function layout() {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!board) return;
  cs = Math.floor(Math.min((W - 84) / board.w, (H * .46) / board.h));
  sx = Math.round((W - board.w * cs) / 2) - 12; sy = 214;
}
window.addEventListener('resize', layout);

// ---------- Crease tabs ----------
function tabs() {
  const t = [];
  for (let k = 1; k < board.w; k++) t.push({ crease: { axis: 'v', k }, x: sx + k * cs, y: sy + board.h * cs + 22 });
  for (let k = 1; k < board.h; k++) t.push({ crease: { axis: 'h', k }, x: sx + board.w * cs + 22, y: sy + k * cs });
  return t;
}
function foldBtn() { return { x: W / 2, y: sy + board.h * cs + 82, w: 200, h: 50 }; }
function undoBtn() { return { x: 48, y: H - 62, w: 76, h: 36 }; }
function resetBtn() { return { x: W - 48, y: H - 62, w: 76, h: 36 }; }
const inBox = (mx, my, b) => Math.abs(mx - b.x) <= b.w / 2 && Math.abs(my - b.y) <= b.h / 2;

cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || anim) return;
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (sel && inBox(mx, my, foldBtn())) return fold();
  if (history.length && inBox(mx, my, undoBtn())) { board = history.pop(); sel = null; return; }
  if (inBox(mx, my, resetBtn())) return load(lvl);
  for (const t of tabs()) if (Math.hypot(mx - t.x, my - t.y) < 18) {
    firstTap = true;
    sel = sel && sel.axis === t.crease.axis && sel.k === t.crease.k ? null : t.crease; return;
  }
  sel = null;
});

function fold() {
  anim = { crease: sel, t: 0, applied: false };
  history.push(board);
}
function finishFold() {
  const used = history.length;
  sel = null;
  if (smudges(board, target).some(Boolean)) return lose('Smudged!', 'Paint landed where the picture has none. Every fold prints both ways, so check the preview dots first.');
  if (matches(board, target)) return win();
  if (used >= L.sol.length) return lose('Out of folds', `This sheet needs exactly ${L.sol.length} fold${L.sol.length > 1 ? 's' : ''}. Try a different crease or order.`);
}

// ---------- Win / lose ----------
const $ = id => document.getElementById(id);
function hide() { ['win', 'lose', 'done'].forEach(id => $(id).classList.remove('show')); }
function win() {
  state = 'won';
  setTimeout(() => {
    if (lvl === LEVELS.length - 1) return $('done').classList.add('show');
    $('winText').textContent = `${L.name} printed in ${history.length} fold${history.length > 1 ? 's' : ''}.`;
    $('win').classList.add('show');
  }, 500);
}
function lose(title, text) {
  state = 'lost';
  setTimeout(() => { $('loseTitle').textContent = title; $('loseText').textContent = text; $('lose').classList.add('show'); }, 450);
}
$('next').onclick = () => load(lvl + 1);
$('retry').onclick = () => load(lvl);
$('again').onclick = () => load(0);
// In the full game this is the rewarded-ad offer.
$('undoAd').onclick = () => { board = history.pop(); hide(); state = 'play'; };

// ---------- Loop ----------
let last = performance.now();
function tick(now) {
  const dt = Math.min(50, now - last); last = now;
  if (anim) {
    anim.t += dt / 900;
    if (!anim.applied && anim.t >= .5) { board = applyFold(board, anim.crease); anim.applied = true; }
    if (anim.t >= 1) { anim = null; finishFold(); }
  }
  draw();
  requestAnimationFrame(tick);
}

// ---------- Drawing ----------
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8b8277'; ctx.font = '600 13px system-ui'; ctx.fillText(`SHEET ${lvl + 1}`, W / 2, 28);
  ctx.fillStyle = '#2a2622'; ctx.font = '800 22px system-ui'; ctx.fillText(L.name, W / 2, 54);
  ctx.fillStyle = '#8b8277'; ctx.font = '13px system-ui'; wrapText(L.tip, W / 2, 76, W - 60, 16);

  // Target card
  const tc = Math.min(14, 120 / Math.max(board.w, board.h)), tw = board.w * tc, th = board.h * tc, tx = W / 2 - tw / 2 - 40, ty = 112;
  ctx.fillStyle = '#8b8277'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'right'; ctx.fillText('MAKE THIS', tx - 12, ty + th / 2 + 4);
  ctx.fillStyle = '#fffdf8'; shadowed(() => rr(tx - 6, ty - 6, tw + 12, th + 12, 6));
  target.forEach((p, i) => { if (!p) return; const x = i % board.w, y = (i / board.w) | 0;
    ctx.fillStyle = PAINT[p]; ctx.beginPath(); ctx.arc(tx + (x + .5) * tc, ty + (y + .5) * tc, tc * .42, 0, 7); ctx.fill(); });
  // Fold counter + recipe
  ctx.textAlign = 'left'; ctx.fillStyle = '#2a2622'; ctx.font = '800 15px system-ui';
  ctx.fillText(`Folds ${history.length}/${L.sol.length}`, tx + tw + 22, ty + 12);
  const mixes = [...new Set(target)].filter(p => p && ![R, Y, B].includes(p));
  mixes.forEach((m, i) => {
    const parts = [R, Y, B].filter(k => m & k), cx = tx + tw + 30, cy = ty + 34 + i * 20;
    [PAINT[parts[0]], PAINT[parts[1]], PAINT[m]].forEach((col, j) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + j * 24, cy, 6, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#8b8277'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center'; ctx.fillText('+', cx + 12, cy + 4); ctx.fillText('=', cx + 36, cy + 4); ctx.textAlign = 'left';
  });
  ctx.textAlign = 'center';

  // Sheet
  const crease = anim ? anim.crease : null;
  if (!crease) drawSide(board, null, 1);
  else {
    const u = anim.t < .5 ? anim.t * 2 : (1 - anim.t) * 2, s = Math.cos(Math.PI * u);
    drawSide(board, { crease, side: 'stay' }, 1);
    drawSide(board, { crease, side: 'flip' }, s);
  }

  // Preview of the selected fold
  if (sel && !anim) {
    const res = applyFold(board, sel), sm = smudges(res, target);
    ctx.save(); ctx.strokeStyle = '#2a2622'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.beginPath();
    if (sel.axis === 'v') { ctx.moveTo(sx + sel.k * cs, sy - 10); ctx.lineTo(sx + sel.k * cs, sy + board.h * cs + 10); }
    else { ctx.moveTo(sx - 10, sy + sel.k * cs); ctx.lineTo(sx + board.w * cs + 10, sy + sel.k * cs); }
    ctx.stroke(); ctx.restore();
    res.cells.forEach((c, i) => {
      if (c.paint === board.cells[i].paint) return;
      const x = i % board.w, y = (i / board.w) | 0, cx = sx + (x + .5) * cs, cy = sy + (y + .5) * cs;
      ctx.setLineDash([4, 3]); ctx.strokeStyle = sm[i] ? '#d11' : PAINT[c.paint]; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, cs * .36, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      if (sm[i]) { ctx.strokeStyle = '#d11'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(cx - cs * .18, cy - cs * .18); ctx.lineTo(cx + cs * .18, cy + cs * .18);
        ctx.moveTo(cx + cs * .18, cy - cs * .18); ctx.lineTo(cx - cs * .18, cy + cs * .18); ctx.stroke(); }
    });
    const fb = foldBtn(), bad = sm.some(Boolean);
    ctx.fillStyle = bad ? '#b5473a' : '#2a2622'; rr(fb.x - fb.w / 2, fb.y - fb.h / 2, fb.w, fb.h, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 18px system-ui'; ctx.fillText(bad ? 'FOLD (will smudge)' : 'FOLD', fb.x, fb.y + 6);
  }

  // Crease tabs
  if (!anim) tabs().forEach(t => {
    const on = sel && sel.axis === t.crease.axis && sel.k === t.crease.k;
    ctx.fillStyle = on ? '#2a2622' : '#fffdf8'; ctx.strokeStyle = '#cfc5b6'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(t.x, t.y, 13, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = on ? '#fff' : '#8b8277'; ctx.lineWidth = 2; ctx.beginPath();
    if (t.crease.axis === 'v') { ctx.moveTo(t.x, t.y - 7); ctx.lineTo(t.x, t.y + 7); } else { ctx.moveTo(t.x - 7, t.y); ctx.lineTo(t.x + 7, t.y); }
    ctx.stroke();
  });

  // Tutorial hint on sheet 1
  if (lvl === 0 && !firstTap && state === 'play') {
    const t = tabs().find(t => t.crease.axis === 'v' && t.crease.k === 3), bob = Math.sin(performance.now() / 180) * 5;
    ctx.strokeStyle = '#e5484d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(t.x, t.y, 19 + bob / 2, 0, 7); ctx.stroke();
    ctx.fillStyle = '#e5484d'; ctx.font = '800 15px system-ui'; ctx.fillText('TAP', t.x, t.y + 42 + bob);
  }

  // Bottom buttons
  const ub = undoBtn(), rb = resetBtn();
  [[ub, 'Undo', history.length > 0], [rb, 'Restart', true]].forEach(([b, label, on]) => {
    ctx.globalAlpha = on ? 1 : .35; ctx.strokeStyle = '#cfc5b6'; ctx.lineWidth = 1.5; rr(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 10); ctx.stroke();
    ctx.fillStyle = '#2a2622'; ctx.font = '700 13px system-ui'; ctx.fillText(label, b.x, b.y + 5); ctx.globalAlpha = 1; });
  // Copyright / Hak cipta
  ctx.fillStyle = '#a89f92'; ctx.font = '10.5px system-ui';
  ctx.fillText('© 2026 Ihsan Mahendra. All rights reserved.', W / 2, H - 22);
  ctx.fillText('Hak cipta dilindungi undang-undang.', W / 2, H - 8);
}

// Draws the paper and paint. With a crease, draws only one side; 'flip' side is scaled around the crease (s from 1 to -1).
function drawSide(bd, part, s) {
  ctx.save();
  let x0 = 0, x1 = bd.w, y0 = 0, y1 = bd.h;
  if (part) {
    const { axis, k } = part.crease, flip = part.side === 'flip';
    if (axis === 'v') { if (flip) x1 = k; else x0 = k; } else { if (flip) y1 = k; else y0 = k; }
    if (flip) {
      const px = sx + k * cs, py = sy + k * cs;
      if (axis === 'v') { ctx.translate(px, 0); ctx.scale(s, 1); ctx.translate(-px, 0); }
      else { ctx.translate(0, py); ctx.scale(1, s); ctx.translate(0, -py); }
    }
  }
  const back = s < 0;
  ctx.fillStyle = back ? '#efe6d6' : '#fffdf8';
  shadowed(() => rr(sx + x0 * cs, sy + y0 * cs, (x1 - x0) * cs, (y1 - y0) * cs, part ? 2 : 6));
  // Faint grid
  ctx.strokeStyle = '#efe8dc'; ctx.lineWidth = 1;
  for (let x = x0 + 1; x < x1; x++) { ctx.beginPath(); ctx.moveTo(sx + x * cs, sy + y0 * cs); ctx.lineTo(sx + x * cs, sy + y1 * cs); ctx.stroke(); }
  for (let y = y0 + 1; y < y1; y++) { ctx.beginPath(); ctx.moveTo(sx + x0 * cs, sy + y * cs); ctx.lineTo(sx + x1 * cs, sy + y * cs); ctx.stroke(); }
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const i = y * bd.w + x, c = bd.cells[i], cx = sx + (x + .5) * cs, cy = sy + (y + .5) * cs;
    // Target ghost: where paint should end up
    if (target[i] && c.paint !== target[i]) { ctx.strokeStyle = PAINT[target[i]]; ctx.globalAlpha = .45; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, cs * .3, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    if (c.paint) blob(cx, cy, cs * .42, PAINT[c.paint], i, c.dry, back);
    if (c.tape) { ctx.fillStyle = 'rgba(214,190,140,.85)'; ctx.fillRect(sx + x * cs + 1, sy + y * cs + cs * .2, cs - 2, cs * .6);
      ctx.strokeStyle = 'rgba(160,130,80,.6)'; ctx.lineWidth = 1; for (let d = 4; d < cs; d += 6) { ctx.beginPath();
        ctx.moveTo(sx + x * cs + d, sy + y * cs + cs * .2); ctx.lineTo(sx + x * cs + d - 4, sy + y * cs + cs * .8); ctx.stroke(); } }
  }
  ctx.restore();
}
// Wobbly ink blot. Dry paint is matte with a dotted ring.
function blob(cx, cy, r, col, seed, dry, back) {
  ctx.fillStyle = col; ctx.globalAlpha = back ? .55 : dry ? .7 : 1; ctx.beginPath();
  for (let a = 0; a <= 12; a++) {
    const ang = a / 12 * Math.PI * 2, wob = 1 + .1 * Math.sin(ang * 3 + seed * 1.7) + .06 * Math.sin(ang * 5 + seed);
    const px = cx + Math.cos(ang) * r * wob, py = cy + Math.sin(ang) * r * wob;
    a ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  if (dry) { ctx.setLineDash([2, 3]); ctx.strokeStyle = '#2a2622'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, r * 1.05, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  else if (!back) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(cx - r * .3, cy - r * .3, r * .18, 0, 7); ctx.fill(); }
}
function shadowed(path) { ctx.save(); ctx.shadowColor = 'rgba(60,40,20,.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4; path(); ctx.fill(); ctx.restore(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function wrapText(t, x, y, maxW, lh) {
  const words = t.split(' '); let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lh; } else line = test; }
  ctx.fillText(line, x, y);
}

layout(); load(0); requestAnimationFrame(tick);
</script>
</body>
</html>
